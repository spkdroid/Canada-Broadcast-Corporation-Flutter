name: cbc_news_reader
description: A modern CBC News Reader application built with Flutter and Clean Architecture.

# Project versioning
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  
  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  equatable: ^2.0.5
  
  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.2
  
  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  
  # Storage & Configuration
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  
  # Utilities
  url_launcher: ^6.2.6
  intl: ^0.19.0
  freezed_annotation: ^2.4.2
  
  # Logging & Error Handling
  logger: ^2.3.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.12
  injectable_generator: ^2.6.1
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  
  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.3
  mockito: ^5.4.4
  
  # Static Analysis
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

# Flutter configuration
flutter:
  uses-material-design: true

  # Assets
  assets:
    - .env
  
  # Fonts (if needed in the future)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
